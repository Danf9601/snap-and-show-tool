name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare GitHub Pages fallback
        run: |
          SITE_DIR="dist/client"
          if [ ! -d "$SITE_DIR" ]; then
            echo "Expected static output in $SITE_DIR"
            ls -la dist || true
            find dist -maxdepth 3 -type d || true
            exit 1
          fi
          touch "$SITE_DIR/.nojekyll"
          if [ -f "$SITE_DIR/_shell.html" ]; then
            cp "$SITE_DIR/_shell.html" "$SITE_DIR/404.html"
          elif [ -f "$SITE_DIR/index.html" ]; then
            cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          else
            echo "No SPA shell or index.html found in $SITE_DIR"
            ls -la "$SITE_DIR"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
